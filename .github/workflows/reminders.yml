# Sends the daily reminder emails that are due, every 15 minutes.
# Vercel's free plan only allows a cron job once a day, so GitHub calls the app instead.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   RIBBON_URL   the site's address, e.g. https://ribbon.example.com (no trailing slash)
#   CRON_SECRET  the same value as CRON_SECRET in Vercel
# GitHub may start a run late; a reminder stays due for 3 hours, so that's fine.
name: Reminder emails

on:
  schedule:
    # Off the top of the hour, when GitHub is busiest and most likely to drop runs.
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          RIBBON_URL: ${{ secrets.RIBBON_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$RIBBON_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "RIBBON_URL or CRON_SECRET is not set; nothing to do."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$RIBBON_URL/api/cron/reminders"
